name: l10n_decompose
description: This CLI generate decomposed localization by different directories for each feature.
version: 1.0.0
repository: https://github.com/AndreyKedo/l10n_decompose
issue_tracker: https://github.com/AndreyKedo/l10n_decompose/issues

topics:
  - l10n
  - localization

workspace: 
  - example

environment:
  sdk: ^3.5.4

# Add regular dependencies here.
dependencies:
  meta: ^1.16.0
  logging: ^1.3.0
  ansi_styles: ^0.3.2+1
  args: ^2.7.0
  path: ^1.9.1
  yaml: ^3.1.3
  glob: ^2.1.3
  code_builder: ^4.11.1
  dart_style: ^3.1.7


dev_dependencies:
  lints: any
  test: any